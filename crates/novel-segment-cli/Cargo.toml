[package]
name = "ws-segment-rs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI, HTTP API, and MCP server for ws-segment-rs"
readme = "README.md"

[[bin]]
name = "ws-segment-rs"
path = "src/main.rs"

[dependencies]
ws-segment-rs = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
glob = "0.3"
url = "2"
