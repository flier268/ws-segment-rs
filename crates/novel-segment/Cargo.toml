[package]
name = "ws-segment-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Chinese word segmentation for web novels (Rust port of novel-segment)"
readme = "README.md"
keywords = ["chinese", "segmentation", "nlp", "tokenizer", "cjk"]
categories = ["text-processing"]

[lib]
name = "novel_segment"

[features]
default = ["default-dict"]
default-dict = ["dep:ws-segment-rs-dict"]

[dependencies]
ws-segment-rs-dict = { workspace = true, optional = true }
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
